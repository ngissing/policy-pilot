openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: PolicyPilot API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: documents
    description: Policy document management
  - name: chat
    description: RAG-powered policy chat
  - name: stats
    description: Dashboard statistics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List all documents
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
        - name: domain
          in: query
          schema:
            type: string
        - name: documentType
          in: query
          schema:
            type: string
        - name: audience
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: resourceScope
          in: query
          schema:
            type: string
            enum: [school, department, external, unknown]
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentListResponse"

  /documents/upload:
    post:
      operationId: uploadDocument
      tags: [documents]
      summary: Upload one or more policy documents
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadDocumentBody"
      responses:
        "202":
          description: Document accepted and queued for AI processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadDocumentResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /documents/review-queue:
    get:
      operationId: getReviewQueue
      tags: [documents]
      summary: Get documents needing human review (confidence below threshold)
      responses:
        "200":
          description: Documents needing review
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"

  /documents/{id}:
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get a single document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateDocument
      tags: [documents]
      summary: Update document metadata (admin review)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDocumentBody"
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete a document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /chat/sessions:
    get:
      operationId: listChatSessions
      tags: [chat]
      summary: List all chat sessions for the authenticated user
      responses:
        "200":
          description: List of chat sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatSession"
    post:
      operationId: createChatSession
      tags: [chat]
      summary: Create a new chat session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChatSessionBody"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSession"

  /chat/sessions/{id}:
    get:
      operationId: getChatSession
      tags: [chat]
      summary: Get a chat session with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSessionWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteChatSession
      tags: [chat]
      summary: Delete a chat session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /chat/sessions/{id}/messages:
    get:
      operationId: getChatMessages
      tags: [chat]
      summary: Get messages in a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a question and get a JSON AI response with citations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendChatMessageBody"
      responses:
        "200":
          description: AI assistant reply with citations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /stats/summary:
    get:
      operationId: getStatsSummary
      tags: [stats]
      summary: Dashboard summary stats
      responses:
        "200":
          description: Summary statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSummary"

  /stats/by-domain:
    get:
      operationId: getStatsByDomain
      tags: [stats]
      summary: Document count by policy domain
      responses:
        "200":
          description: Stats by domain
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DomainStat"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Document:
      type: object
      properties:
        id:
          type: integer
        filename:
          type: string
        title:
          type: ["string", "null"]
        fileType:
          type: string
        issuingAuthority:
          type: ["string", "null"]
        policyDomain:
          type: ["string", "null"]
        documentType:
          type: ["string", "null"]
        audience:
          type: ["string", "null"]
        confidenceScore:
          type: ["number", "null"]
        sourceUrl:
          type: ["string", "null"]
        resourceScope:
          type: ["string", "null"]
          enum: [school, department, external, unknown, null]
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - filename
        - fileType
        - status
        - createdAt
        - updatedAt

    DocumentListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Document"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
      required: [data, total, page, pageSize]

    UploadDocumentBody:
      type: object
      properties:
        files:
          type: array
          items:
            type: string
            format: binary
          maxItems: 20
        resourceScope:
          type: string
          description: Applies to every uploaded file. Use ai to let PolicyPilot classify it.
          enum: [school, department, external, unknown, ai]
      required:
        - files

    UploadResultItem:
      type: object
      properties:
        id:
          type: integer
        filename:
          type: string
        status:
          type: string
        message:
          type: string
      required:
        - id
        - filename
        - status
        - message

    UploadErrorItem:
      type: object
      properties:
        filename:
          type: string
        error:
          type: string
      required:
        - filename
        - error

    UploadDocumentResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/UploadResultItem"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/UploadErrorItem"
      required:
        - results
        - errors

    UpdateDocumentBody:
      type: object
      properties:
        title:
          type: string
        issuingAuthority:
          type: string
        policyDomain:
          type: string
        documentType:
          type: string
        audience:
          type: string
        resourceScope:
          type: string
          enum: [school, department, external, unknown]
        status:
          type: string

    ChatSession:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - title
        - createdAt
        - updatedAt

    CreateChatSessionBody:
      type: object
      properties:
        title:
          type: string

    ChatMessage:
      type: object
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        role:
          type: string
        content:
          type: string
        citations:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/Citation"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - sessionId
        - role
        - content
        - createdAt

    SendChatMessageBody:
      type: object
      properties:
        question:
          type: string
      required:
        - question

    ChatSessionWithMessages:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
      required:
        - id
        - userId
        - title
        - createdAt
        - updatedAt
        - messages

    StatsSummary:
      type: object
      properties:
        total:
          type: integer
        approved:
          type: integer
        pending:
          type: integer
        processing:
          type: integer
      required:
        - total
        - approved
        - pending
        - processing

    DomainStat:
      type: object
      properties:
        domain:
          type: string
        count:
          type: integer
      required:
        - domain
        - count

    Citation:
      type: object
      properties:
        documentId:
          type: integer
        title:
          type: ["string", "null"]
        filename:
          type: string
        excerpt:
          type: string
      required:
        - documentId
        - filename
        - excerpt
